name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Release (e.g., v1.9.0)"
        required: true

permissions:
  contents: read

jobs:
  docker-release:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event.inputs.release || github.event.release.tag_name }}
      DOCKER_IMAGE_NAME: tonbypass/coredns
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build CoreDNS binary with custom plugins
        run: |
          make coredns
          ./coredns -plugins | tee plugins.txt
          grep -qx filter plugins.txt
          grep -qx blocklist plugins.txt
      - name: Build Docker Images
        run: |
          VERSION="${RELEASE#v}"
          docker version
          DOCKER_BUILDKIT=1 docker build --platform=linux/amd64 -t "${DOCKER_IMAGE_NAME}:amd64-${VERSION}" .
      - name: Show Docker Images
        run: docker images
      - name: Docker login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Publish Docker Images
        run: |
          VERSION="${RELEASE#v}"
          docker push "${DOCKER_IMAGE_NAME}:amd64-${VERSION}"
          docker manifest create --amend "${DOCKER_IMAGE_NAME}:${VERSION}" "${DOCKER_IMAGE_NAME}:amd64-${VERSION}"
          docker manifest create --amend "${DOCKER_IMAGE_NAME}:latest" "${DOCKER_IMAGE_NAME}:amd64-${VERSION}"
          docker manifest push --purge "${DOCKER_IMAGE_NAME}:${VERSION}"
          docker manifest push --purge "${DOCKER_IMAGE_NAME}:latest"
